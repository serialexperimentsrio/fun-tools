[workspace]
resolver = "3"
members = [
  "common",
  "cop",
  "dat",
  "del",
  "dog",
  "eco",
  "hid",
  "idx",
  "loc",
  "mop",
  "mov",
  "new",
  "put",
  "sel",
  "ted",
  "usg",
]

[workspace.package]
version = "0.1.0"
edition = "2024"
rust-version = "1.85"

[workspace.dependencies]
arboard = "3.6"
chrono = "0.4"
clap = { version = "4.5", features = ["derive"] }
common = { path = "common" }
libc = "0.2"
serde_json = "1"
