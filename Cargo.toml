[workspace]
resolver = "3"
members = ["crates/*"]

[workspace.package]
version = "0.1.0"
edition = "2024"
rust-version = "1.85"

[workspace.dependencies]
arboard = "3.6"
chrono = "0.4"
clap = { version = "4.5", features = ["derive"] }
common = { path = "crates/common" }
libc = "0.2"
serde_json = "1"
